name: Deploy Worker

# Staging deploys automatically after CI passes on main; production only when
# run by hand (Actions → Deploy Worker → Run workflow → production).
# The web app deploys separately through Vercel's Git integration.
#
# Inert until these are set (Settings → Secrets and variables → Actions):
#   secrets  CLOUDFLARE_API_TOKEN   token with "Edit Cloudflare Workers" permission
#            CLOUDFLARE_ACCOUNT_ID
#            ADMIN_TOKEN_STAGING    optional; same value as the staging Worker's ADMIN_TOKEN,
#                                   lets the latency check create boards past Turnstile
#   variable STAGING_WORKER_HOST    optional; e.g. livekanban-staging.<you>.workers.dev,
#                                   enables the post-deploy latency check (the Phase 3 gate)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  configured:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy: set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable it."
          fi

  deploy:
    needs: configured
    if: >-
      needs.configured.outputs.ready == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub environments let you require approval before production deploys.
    environment: ${{ inputs.environment || 'staging' }}
    env:
      TARGET: ${{ inputs.environment || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # For automatic deploys, ship exactly the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Deploy ${{ env.TARGET }}
        run: pnpm --filter worker exec wrangler deploy --env "$TARGET"

      - name: Cursor latency on staging (p95 must be under 100 ms)
        if: env.TARGET == 'staging' && vars.STAGING_WORKER_HOST != ''
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN_STAGING }}
        run: pnpm --filter worker latency --host "${{ vars.STAGING_WORKER_HOST }}"
