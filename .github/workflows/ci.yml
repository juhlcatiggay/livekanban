name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Worker smoke test
        run: pnpm --filter worker test
      - name: Expiry, trash, backups, limits and import (short windows)
        run: pnpm --filter worker test:hardening
      - name: Cursor relay latency (local Worker)
        run: pnpm --filter worker latency
      - name: Worker bundle (dry run)
        run: pnpm --filter worker exec wrangler deploy --dry-run --outdir dist

      - name: Build web
        run: pnpm build
        env:
          NEXT_PUBLIC_PARTY_HOST: localhost:8797 # must match playwright.config.ts
      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm --filter web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
